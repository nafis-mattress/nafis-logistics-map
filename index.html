<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نقشه لجستیک نفیس</title>

<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">

<style>
*{box-sizing:border-box}
html,body{
  height:100%;margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#eef3f3
}
#map{position:absolute;inset:0}

.panel{
  position:absolute;z-index:10;
  top:14px;right:14px;
  width:365px;
  max-height:calc(100vh - 28px);
  overflow:auto;
  background:#fff;
  border-radius:18px;
  padding:14px 16px;
  box-shadow:0 8px 30px #0002
}

.title{
  font-weight:700;
  color:#00656D;
  font-size:18px;
  margin-bottom:3px
}
.subtitle{
  font-size:11px;
  color:#777;
  margin-bottom:10px
}

.row{
  display:flex;
  gap:7px;
  margin-top:8px
}

select,input,button{
  font-family:inherit;
  border:1px solid #d7dddd;
  border-radius:10px;
  padding:9px;
  font-size:12px
}

select,input{
  flex:1;
  min-width:0;
  background:#fff
}

button{
  background:#00656D;
  color:#fff;
  border:none;
  cursor:pointer;
  transition:.15s
}
button:hover{opacity:.9}
button:disabled{opacity:.45;cursor:not-allowed}

.secondary{
  background:#eef5f5;
  color:#00656D
}

.danger{
  background:#B74E3D
}

.gold{
  background:#D09039
}

.selectMode{
  width:100%;
  margin-top:10px;
  background:#eef5f5;
  color:#00656D;
  border:1px solid #cfe2e2;
  font-weight:bold
}

.selectMode.active{
  background:#00656D;
  color:#fff;
  border-color:#00656D
}

.status{
  margin-top:8px;
  font-size:11px;
  padding:8px 10px;
  border-radius:10px;
  background:#eef7f7;
  color:#00656D;
  line-height:1.8
}

.section{
  margin-top:14px;
  padding-top:12px;
  border-top:1px solid #eee
}

.sectionTitle{
  font-size:13px;
  font-weight:bold;
  color:#171C1F;
  margin-bottom:7px
}

.planBox{
  background:#f7f9f9;
  border:1px solid #e4eaea;
  border-radius:13px;
  padding:10px;
  margin-top:8px
}

.stop{
  display:flex;
  align-items:center;
  gap:8px;
  border-bottom:1px solid #e8eded;
  padding:8px 0;
  font-size:11px
}
.stop:last-child{border-bottom:0}

.stopNumber{
  width:27px;
  height:27px;
  min-width:27px;
  border-radius:50%;
  background:#00656D;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold
}

.stopInfo{
  flex:1;
  line-height:1.7
}

.stopRemove{
  width:27px;
  height:27px;
  padding:0;
  border-radius:7px;
  background:#fff;
  color:#B74E3D;
  border:1px solid #eed7d3
}

.routeInfo{
  margin-top:8px;
  background:#fff8ec;
  border:1px solid #f0dfbd;
  border-radius:10px;
  padding:9px;
  font-size:11px;
  line-height:1.9
}

.pin{
  width:23px;
  height:23px;
  border-radius:50% 50% 50% 0;
  border:3px solid #fff;
  box-shadow:0 2px 8px #0004;
  transform:rotate(-45deg);
  cursor:pointer
}

.pin.ready{background:#00656D}
.pin.wait{background:#D09039}
.pin.planned{background:#3d6fb6}
.pin.delivered{background:#8b8b8b}

.pin.selected{
  width:31px;
  height:31px;
  border-radius:50%;
  transform:none;
  background:#171C1F;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:bold;
  font-size:12px;
  border:3px solid #fff
}

.popup{
  direction:rtl;
  min-width:230px;
  font-family:Tahoma,Arial
}

.popupName{
  font-size:14px;
  font-weight:bold;
  color:#00656D;
  margin-bottom:6px
}

.popupLine{
  font-size:11px;
  line-height:1.9;
  color:#444
}

.popupActions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  margin-top:8px
}

.popupActions a,
.popupActions button{
  text-align:center;
  text-decoration:none;
  padding:7px 5px;
  border-radius:8px;
  font-size:10px;
  border:0
}

.popupActions a{
  background:#eef5f5;
  color:#00656D
}

.popupActions button{
  background:#00656D;
  color:#fff
}

.legend{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
  font-size:10px;
  color:#555
}

.legend span:before{
  content:"";
  display:inline-block;
  width:9px;
  height:9px;
  border-radius:50%;
  margin-left:4px;
  vertical-align:middle
}

.legend .a:before{background:#00656D}
.legend .b:before{background:#D09039}
.legend .c:before{background:#3d6fb6}

.small{
  font-size:10px;
  color:#777;
  line-height:1.8
}

.success{color:#00656D}
.error{color:#B74E3D}
.loading{color:#D09039}

.counter{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:25px;
  height:25px;
  border-radius:50%;
  background:#00656D;
  color:#fff;
  font-size:11px;
  font-weight:bold
}

@media(max-width:650px){
  .panel{
    top:auto;
    bottom:8px;
    right:8px;
    left:8px;
    width:auto;
    max-height:52vh
  }
}
</style>
</head>

<body>

<div id="map"></div>

<div class="panel">

  <div class="title">نقشه لجستیک نفیس</div>
  <div class="subtitle">
    مدیریت سفارش‌ها و برنامه‌ریزی مسیر رانندگان
  </div>

  <div class="row">
    <select id="cityFilter">
      <option value="">همه شهرها</option>
    </select>

    <select id="statusFilter">
      <option value="">همه وضعیت‌های باز</option>
      <option>آماده برنامه‌ریزی</option>
      <option>در انتظار تولید</option>
      <option>ارسال برنامه‌ریزی شده</option>
    </select>
  </div>

  <div class="row">
    <input id="searchInput"
      placeholder="نام، موبایل، سفارش، آدرس...">
    <button id="refreshBtn">بروزرسانی</button>
  </div>

  <div id="dataStatus" class="status">
    در حال دریافت اطلاعات...
  </div>

  <button id="selectModeBtn" class="selectMode">
    ☑️ فعال کردن انتخاب مسیر
  </button>

  <div id="selectionHelp" class="status">
    برای برنامه‌ریزی چند سفارش، ابتدا «انتخاب مسیر» را فعال کنید.
  </div>

  <div class="legend">
    <span class="a">آماده برنامه‌ریزی</span>
    <span class="b">در انتظار تولید</span>
    <span class="c">برنامه‌ریزی شده</span>
  </div>


  <div class="section">

    <div class="sectionTitle">
      🚚 برنامه ارسال
      &nbsp;
      <span id="selectedCount" class="counter">0</span>
    </div>

    <select id="driverSelect">
      <option value="">انتخاب راننده...</option>
    </select>

    <div id="driverInfo" class="small"></div>

    <div class="row">
      <button id="optimizeBtn">
        🧠 بهینه‌سازی مسیر
      </button>

      <button id="clearPlanBtn" class="secondary">
        پاک کردن
      </button>
    </div>

    <div id="routeStatus" class="status">
      هنوز سفارشی انتخاب نشده است.
    </div>

    <div id="routeInfo"></div>

    <div id="stopsList" class="planBox">
      <div class="small">
        هنوز سفارشی به برنامه اضافه نشده است.
      </div>
    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<script>

/* ===============================
   تنظیمات
================================ */

const ORDERS_CSV =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTZn_pFhDgKsUuFJ6Rj4RKzJcRTH64KoTM9rTE0N43RqmUCj7E-UnoYxRMlBhsicUytqxWpYKzQkUa7/pub?gid=0&single=true&output=csv";

const DRIVERS_CSV =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTZn_pFhDgKsUuFJ6Rj4RKzJcRTH64KoTM9rTE0N43RqmUCj7E-UnoYxRMlBhsicUytqxWpYKzQkUa7/pub?gid=1633494032&single=true&output=csv";

/*
  همان کلید تست Map.ir که فرستادی را
  بین کوتیشن زیر Paste کن.
*/
const MAPIR_KEY = "eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIsImp0aSI6ImUzM2Y0N2UyMDkxYTI2NzA0NjQzYjc5OTU2ZjQ1MDBlMTc3NzA2YmI2NzBhODM5NjFmMjdiODA0YzZmMmFlYTRmNGZjODM4ZDQwZmZjYzhkIn0.eyJhdWQiOiI0NDAyOCIsImp0aSI6ImUzM2Y0N2UyMDkxYTI2NzA0NjQzYjc5OTU2ZjQ1MDBlMTc3NzA2YmI2NzBhODM5NjFmMjdiODA0YzZmMmFlYTRmNGZjODM4ZDQwZmZjYzhkIiwiaWF0IjoxNzg5NDcxMDE1LCJuYmYiOjE3ODk0NzEwMTUsImV4cCI6MTc5MjE1MzAxNSwic3ViIjoiIiwic2NvcGVzIjpbImJhc2ljIl19.iFEs3zfgdbVXTenqn73XcGuy5PZ7hsBnpyHES8_hZb0oiEfVlmaaswiKwrQOyg0ty7rxpNGoJ8ifrC8yy7-k4YMdxXHgrthNson3d7fLO9TeogDtQ2W2lCBjr_MBAMFdLeJUIkw4x6up0TSPEC9jXWsm0FXKm-ATn2E-JNnXwSr5LhbFAJW2wktb1yXt8Mke3PLoF2Q3dtNIVHs3ZxACQMtvQ9Ufp--jlxDc3eydcQQCelFWHbtbeyhRvi08C6TKn711a5Z3mzUGKVNqusBBN-f5FdKwADi6kC8AECyTYSPx1wNfWa3ezaDMMyTHts-vHJIg8ipwjMCmP7WafvkHEA";


/* ===============================
   RTL
================================ */

try{
  const rtlStatus=maplibregl.getRTLTextPluginStatus();

  if(
    rtlStatus!=="loaded" &&
    rtlStatus!=="loading" &&
    rtlStatus!=="deferred"
  ){
    maplibregl.setRTLTextPlugin(
      "https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.min.js",
      false
    );
  }
}catch(error){
  console.warn("RTL:",error);
}


/* ===============================
   MAP
================================ */

const map=new maplibregl.Map({
  container:"map",

  style:
  "https://map.ir/vector/styles/main/mapir-xyz-style.json",

  center:[51.2,35.3],
  zoom:7.2,

  transformRequest:(url)=>{
    if(url.includes("map.ir")){
      return{
        url,
        headers:{
          "x-api-key":MAPIR_KEY
        }
      };
    }

    return{url};
  }
});

map.addControl(
  new maplibregl.NavigationControl(),
  "bottom-left"
);


/* ===============================
   DATA
================================ */

let orders=[];
let drivers=[];
let markers=[];

let selectedOrders=[];

let selectionMode=false;


/* ===============================
   HELPERS
================================ */

function esc(s){
  return String(s??"").replace(
    /[&<>"]/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;"
    }[m])
  );
}


function parseCSV(text){

  const out=[];
  let row=[];
  let field="";
  let q=false;

  for(let i=0;i<text.length;i++){

    const c=text[i];
    const n=text[i+1];

    if(c=='"'){

      if(q && n=='"'){
        field+='"';
        i++;
      }else{
        q=!q;
      }

    }else if(c==',' && !q){

      row.push(field);
      field="";

    }else if((c=='\n'||c=='\r') && !q){

      if(c=='\r' && n=='\n')i++;

      row.push(field);
      field="";

      if(row.some(x=>x!=="")){
        out.push(row);
      }

      row=[];

    }else{
      field+=c;
    }
  }

  if(field||row.length){
    row.push(field);
    out.push(row);
  }

  return out;
}


function csvToObjects(text){

  const data=parseCSV(text);

  if(!data.length)return[];

  const headers=
    data[0].map(x=>x.trim());

  return data.slice(1).map(row=>{

    const obj={};

    headers.forEach((h,i)=>{
      obj[h]=(row[i]??"").trim();
    });

    return obj;
  });
}


function orderCode(r){
  return String(
    r["کد سفارش"] ||
    r["شماره سفارش"] ||
    ""
  );
}


function getLat(r){
  return parseFloat(
    String(
      r["عرض جغرافیایی"]||""
    ).replace(",",".")
  );
}


function getLng(r){
  return parseFloat(
    String(
      r["طول جغرافیایی"]||""
    ).replace(",",".")
  );
}


function validCoords(r){

  return(
    Number.isFinite(getLat(r)) &&
    Number.isFinite(getLng(r))
  );
}


function phoneLink(s){

  let p=
    String(s||"")
    .replace(/[^\d+]/g,"");

  if(
    p.length===10 &&
    p.startsWith("9")
  ){
    p="0"+p;
  }

  return p;
}


function statusClass(s){

  if(s==="آماده برنامه‌ریزی")
    return"ready";

  if(s==="در انتظار تولید")
    return"wait";

  if(s==="ارسال برنامه‌ریزی شده")
    return"planned";

  return"delivered";
}


function selectedIndex(r){

  return selectedOrders.findIndex(
    x=>orderCode(x)===orderCode(r)
  );
}


/* ===============================
   LOAD DATA
================================ */

async function loadData(){

  const status=
    document.getElementById("dataStatus");

  status.textContent=
    "در حال دریافت سفارش‌ها و رانندگان...";

  try{

    const stamp=Date.now();

    const [oRes,dRes]=await Promise.all([

      fetch(
        ORDERS_CSV+"&_="+stamp,
        {cache:"no-store"}
      ),

      fetch(
        DRIVERS_CSV+"&_="+stamp,
        {cache:"no-store"}
      )

    ]);

    if(!oRes.ok)
      throw new Error("دریافت سفارش‌ها ناموفق بود.");

    if(!dRes.ok)
      throw new Error("دریافت رانندگان ناموفق بود.");


    orders=csvToObjects(
      await oRes.text()
    );

    drivers=csvToObjects(
      await dRes.text()
    );


    populateCities();
    populateDrivers();
    renderOrders();


    const openCount=
      orders.filter(
        r=>
        (r["وضعیت ارسال"]||"").trim()
        !=="تحویل شده"
      ).length;


    status.innerHTML=
      `سفارش باز: <b>${openCount}</b>
       &nbsp; | &nbsp;
       راننده: <b>${drivers.length}</b>`;

  }catch(error){

    console.error(error);

    status.innerHTML=
      `<span class="error">
      ${esc(error.message)}
      </span>`;
  }
}


/* ===============================
   FILTERS
================================ */

function populateCities(){

  const select=
    document.getElementById("cityFilter");

  const old=select.value;

  select.innerHTML=
    '<option value="">همه شهرها</option>';


  const cities=[
    ...new Set(
      orders
      .map(r=>r["شهر"])
      .filter(Boolean)
    )
  ].sort();


  cities.forEach(city=>{

    const op=document.createElement("option");

    op.value=city;
    op.textContent=city;

    select.appendChild(op);
  });

  select.value=old;
}


function populateDrivers(){

  const select=
    document.getElementById("driverSelect");

  select.innerHTML=
    '<option value="">انتخاب راننده...</option>';


  drivers
  .filter(
    d=>(d["وضعیت"]||"").trim()==="فعال"
  )
  .forEach(d=>{

    const op=document.createElement("option");

    op.value=d["کد راننده"];

    op.textContent=
      `${d["نام و نام خانوادگی"]} - ${d["نوع خودرو"]||""}`;

    select.appendChild(op);
  });
}


/* ===============================
   DRIVER
================================ */

function getDriver(){

  const id=
    document.getElementById(
      "driverSelect"
    ).value;

  return drivers.find(
    d=>d["کد راننده"]===id
  );
}


function showDriverInfo(){

  const d=getDriver();

  const box=
    document.getElementById(
      "driverInfo"
    );

  if(!d){
    box.innerHTML="";
    return;
  }

  box.innerHTML=
    `
    🚚 ${esc(d["نوع خودرو"]||"-")}
    &nbsp; | &nbsp;
    ظرفیت:
    <b>${esc(d["ظرفیت سفارش"]||"-")}</b>
    سفارش

    <br>

    📍 ${esc(d["محدوده فعالیت"]||"-")}

    &nbsp; | &nbsp;

    📞 ${esc(phoneLink(d["موبایل"]))}
    `;
}


/* ===============================
   SELECTION MODE
================================ */

function toggleSelectionMode(){

  selectionMode=!selectionMode;

  const btn=
    document.getElementById(
      "selectModeBtn"
    );

  const help=
    document.getElementById(
      "selectionHelp"
    );


  if(selectionMode){

    btn.classList.add("active");

    btn.textContent=
      "✅ انتخاب مسیر فعال است";

    help.innerHTML=
      `روی پین مشتری‌ها کلیک کنید.
       هر کلیک یک سفارش را انتخاب می‌کند.
       برای حذف، دوباره روی همان پین بزنید.`;

  }else{

    btn.classList.remove("active");

    btn.textContent=
      "☑️ فعال کردن انتخاب مسیر";

    help.innerHTML=
      `حالت انتخاب خاموش است.
       کلیک روی پین، اطلاعات مشتری را نمایش می‌دهد.`;
  }
}


/* ===============================
   MAP ORDERS
================================ */

function clearMarkers(){

  markers.forEach(m=>m.remove());

  markers=[];
}


function renderOrders(){

  clearMarkers();

  const city=
    document.getElementById(
      "cityFilter"
    ).value;

  const st=
    document.getElementById(
      "statusFilter"
    ).value;

  const term=
    document.getElementById(
      "searchInput"
    ).value
    .trim()
    .toLowerCase();


  const filtered=
    orders.filter(r=>{

      if(
        (r["وضعیت ارسال"]||"").trim()
        ==="تحویل شده"
      ){
        return false;
      }

      if(
        city &&
        r["شهر"]!==city
      ){
        return false;
      }

      if(
        st &&
        r["وضعیت ارسال"]!==st
      ){
        return false;
      }

      if(term){

        const hay=[
          orderCode(r),
          r["نام مشتری"],
          r["موبایل مشتری"],
          r["شهر"],
          r["آدرس"],
          r["اقلام سفارش"]
        ]
        .join(" ")
        .toLowerCase();

        if(!hay.includes(term))
          return false;
      }

      return validCoords(r);
    });


  filtered.forEach(r=>{

    const el=
      document.createElement("div");

    const index=
      selectedIndex(r);


    if(index>=0){

      el.className=
        "pin selected";

      el.textContent=
        String(index+1);

    }else{

      el.className=
        "pin "+
        statusClass(
          r["وضعیت ارسال"]
        );
    }


    const marker=
      new maplibregl.Marker({
        element:el
      })
      .setLngLat([
        getLng(r),
        getLat(r)
      ])
      .addTo(map);


    el.addEventListener(
      "click",
      event=>{

        event.stopPropagation();

        if(selectionMode){

          toggleOrder(r);

        }else{

          showPopup(r,marker);
        }
      }
    );


    markers.push(marker);
  });


  document.getElementById(
    "dataStatus"
  ).innerHTML=
    `نمایش <b>${filtered.length}</b>
     سفارش روی نقشه
     &nbsp; | &nbsp;
     انتخاب‌شده:
     <b>${selectedOrders.length}</b>`;
}


/* ===============================
   TOGGLE ORDER
================================ */

function toggleOrder(r){

  const index=
    selectedIndex(r);

  if(index>=0){

    selectedOrders.splice(index,1);

    setRouteStatus(
      `${r["نام مشتری"]||"سفارش"} از برنامه حذف شد.`
    );

  }else{

    selectedOrders.push(r);

    setRouteStatus(
      `${r["نام مشتری"]||"سفارش"} به برنامه اضافه شد.`,
      "success"
    );
  }


  clearRoute();

  renderStops();
  renderOrders();
}


/* ===============================
   POPUP
================================ */

function showPopup(r,marker){

  const lat=getLat(r);
  const lng=getLng(r);

  const phone=
    phoneLink(
      r["موبایل مشتری"]
    );

  const google=
    `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;


  const isSelected=
    selectedIndex(r)>=0;


  const html=`
    <div class="popup">

      <div class="popupName">
        ${esc(r["نام مشتری"]||"مشتری")}
      </div>

      <div class="popupLine">
        سفارش:
        <b>${esc(orderCode(r))}</b>
      </div>

      <div class="popupLine">
        📞 ${esc(phone)}
      </div>

      <div class="popupLine">
        📍 ${esc(r["شهر"]||"")}
        ${r["آدرس"] ?
          " - "+esc(r["آدرس"])
          :""
        }
      </div>

      <div class="popupLine">
        🛏 ${esc(r["اقلام سفارش"]||"-")}
      </div>

      <div class="popupLine">
        وضعیت:
        <b>
          ${esc(r["وضعیت ارسال"]||"-")}
        </b>
      </div>

      <div class="popupActions">

        <a href="tel:${phone}">
          📞 تماس
        </a>

        <a
          href="${google}"
          target="_blank"
          rel="noopener"
        >
          🧭 مسیریاب
        </a>

        <button
          onclick="toggleOrderByCode('${esc(orderCode(r))}')"
        >
          ${isSelected ?
            "➖ حذف از مسیر":
            "➕ افزودن به مسیر"
          }
        </button>

        <button
          onclick="focusOrder('${esc(orderCode(r))}')"
        >
          📍 نمایش
        </button>

      </div>

    </div>
  `;


  marker.setPopup(
    new maplibregl.Popup({
      offset:25,
      maxWidth:"300px"
    }).setHTML(html)
  );


  marker.togglePopup();
}


window.toggleOrderByCode=
function(code){

  const r=
    orders.find(
      x=>orderCode(x)===String(code)
    );

  if(!r)return;

  toggleOrder(r);
};


window.focusOrder=
function(code){

  const r=
    orders.find(
      x=>orderCode(x)===String(code)
    );

  if(!r || !validCoords(r))
    return;

  map.flyTo({
    center:[
      getLng(r),
      getLat(r)
    ],
    zoom:15
  });
};


/* ===============================
   STOPS LIST
================================ */

function renderStops(){

  const box=
    document.getElementById(
      "stopsList"
    );

  document.getElementById(
    "selectedCount"
  ).textContent=
    selectedOrders.length;


  if(!selectedOrders.length){

    box.innerHTML=
      `<div class="small">
       هنوز سفارشی به برنامه اضافه نشده است.
       </div>`;

    return;
  }


  box.innerHTML=
    selectedOrders
    .map((r,i)=>`

      <div class="stop">

        <div class="stopNumber">
          ${i+1}
        </div>

        <div class="stopInfo">

          <b>
            ${esc(r["نام مشتری"]||"-")}
          </b>

          <br>

          ${esc(r["شهر"]||"")}
          &nbsp; | &nbsp;
          ${esc(orderCode(r))}

        </div>

        <button
          class="stopRemove"
          onclick="removeStop(${i})"
        >
          ×
        </button>

      </div>

    `)
    .join("");
}


window.removeStop=
function(index){

  const removed=
    selectedOrders[index];

  selectedOrders.splice(
    index,
    1
  );

  clearRoute();

  renderStops();
  renderOrders();

  if(removed){

    setRouteStatus(
      `${removed["نام مشتری"]||"سفارش"} از برنامه حذف شد.`
    );
  }
};


/* ===============================
   ROUTE STATUS
================================ */

function setRouteStatus(
  text,
  type=""
){

  const el=
    document.getElementById(
      "routeStatus"
    );

  el.className=
    "status "+type;

  el.textContent=text;
}


/* ===============================
   CLEAR ROUTE
================================ */

function clearRoute(){

  if(
    map.getLayer(
      "nafis-route-line"
    )
  ){
    map.removeLayer(
      "nafis-route-line"
    );
  }

  if(
    map.getSource(
      "nafis-route"
    )
  ){
    map.removeSource(
      "nafis-route"
    );
  }

  document.getElementById(
    "routeInfo"
  ).innerHTML="";
}


/* ===============================
   CLEAR PLAN
================================ */

function clearPlan(){

  selectedOrders=[];

  clearRoute();

  renderStops();
  renderOrders();

  setRouteStatus(
    "برنامه مسیر پاک شد."
  );
}


/* ===============================
   TSP MAP.IR
================================ */

async function optimizeRoute(){

  const driver=
    getDriver();


  if(!driver){

    setRouteStatus(
      "ابتدا راننده را انتخاب کنید.",
      "error"
    );

    return;
  }


  if(selectedOrders.length<2){

    setRouteStatus(
      "حداقل دو سفارش برای برنامه‌ریزی مسیر انتخاب کنید.",
      "error"
    );

    return;
  }


  const capacity=
    parseInt(
      driver["ظرفیت سفارش"]||"0",
      10
    );


  if(
    capacity>0 &&
    selectedOrders.length>capacity
  ){

    setRouteStatus(
      `ظرفیت راننده ${capacity} سفارش است؛ ${selectedOrders.length} سفارش انتخاب شده.`,
      "error"
    );

    return;
  }


  if(
    selectedOrders.some(
      r=>!validCoords(r)
    )
  ){

    setRouteStatus(
      "مختصات یکی از سفارش‌ها معتبر نیست.",
      "error"
    );

    return;
  }


  const btn=
    document.getElementById(
      "optimizeBtn"
    );

  btn.disabled=true;


  setRouteStatus(
    "در حال محاسبه مسیر پیشنهادی توسط Map.ir...",
    "loading"
  );


  try{

    const coords=
      selectedOrders
      .map(
        r=>
        `${getLng(r)},${getLat(r)}`
      )
      .join(";");


    const url=
      `https://map.ir/vrp/tsp/v1/driving/${coords}`+
      `?roundtrip=true`+
      `&source=any`+
      `&destination=any`+
      `&geometries=geojson`+
      `&overview=full`;


    const response=
      await fetch(
        url,
        {
          method:"GET",

          headers:{
            "x-api-key":
              MAPIR_KEY
          }
        }
      );


    if(!response.ok){

      const text=
        await response.text();

      throw new Error(
        `HTTP ${response.status} - ${text.slice(0,180)}`
      );
    }


    const data=
      await response.json();


    if(
      !data.trips ||
      !data.trips.length
    ){

      throw new Error(
        data.message ||
        data.code ||
        "مسیر از Map.ir دریافت نشد."
      );
    }


    /*
      مرتب کردن سفارش‌ها طبق
      ترتیب پیشنهادی TSP
    */

    if(
      Array.isArray(data.waypoints)
    ){

      selectedOrders=
        selectedOrders
        .map((order,index)=>({

          order,

          position:
            data.waypoints[index]
            ?.waypoint_index
            ?? index

        }))
        .sort(
          (a,b)=>
          a.position-b.position
        )
        .map(
          item=>item.order
        );
    }


    const trip=
      data.trips[0];


    renderStops();
    renderOrders();

    drawRoute(
      trip.geometry
    );

    showRouteResult(
      trip,
      driver
    );

    fitSelectedOrders();


    setRouteStatus(
      `مسیر پیشنهادی برای ${driver["نام و نام خانوادگی"]} با موفقیت محاسبه شد.`,
      "success"
    );


  }catch(error){

    console.error(error);

    setRouteStatus(
      `خطای مسیریابی: ${error.message}`,
      "error"
    );

  }finally{

    btn.disabled=false;
  }
}


/* ===============================
   DRAW ROUTE
================================ */

function drawRoute(geometry){

  if(
    !geometry ||
    !geometry.type ||
    !geometry.coordinates
  ){

    throw new Error(
      "هندسه مسیر معتبر نیست."
    );
  }


  const feature={
    type:"Feature",
    properties:{},
    geometry
  };


  if(
    map.getSource(
      "nafis-route"
    )
  ){

    map.getSource(
      "nafis-route"
    ).setData(feature);

    return;
  }


  map.addSource(
    "nafis-route",
    {
      type:"geojson",
      data:feature
    }
  );


  map.addLayer({

    id:"nafis-route-line",

    type:"line",

    source:"nafis-route",

    layout:{
      "line-join":"round",
      "line-cap":"round"
    },

    paint:{
      "line-color":"#00656D",
      "line-width":6,
      "line-opacity":0.9
    }
  });
}


/* ===============================
   ROUTE RESULT
================================ */

function showRouteResult(
  trip,
  driver
){

  const km=
    Number(
      trip.distance||0
    )/1000;


  const minutes=
    Number(
      trip.duration||0
    )/60;


  let timeText;


  if(minutes>=60){

    const h=
      Math.floor(
        minutes/60
      );

    const m=
      Math.round(
        minutes%60
      );

    timeText=
      `${h} ساعت و ${m} دقیقه`;

  }else{

    timeText=
      `${Math.round(minutes)} دقیقه`;
  }


  document.getElementById(
    "routeInfo"
  ).innerHTML=`

    <div class="routeInfo">

      <b>
        🚚 مسیر پیشنهادی ارسال
      </b>

      <br>

      راننده:
      <b>
        ${esc(driver["نام و نام خانوادگی"])}
      </b>

      <br>

      خودرو:
      ${esc(driver["نوع خودرو"]||"-")}

      <br>

      تعداد سفارش:
      <b>${selectedOrders.length}</b>

      <br>

      مسافت:
      <b>${km.toFixed(1)} کیلومتر</b>

      <br>

      زمان رانندگی:
      <b>${timeText}</b>

    </div>
  `;
}


/* ===============================
   FIT
================================ */

function fitSelectedOrders(){

  if(!selectedOrders.length)
    return;


  const bounds=
    new maplibregl.LngLatBounds();


  selectedOrders.forEach(r=>{

    if(validCoords(r)){

      bounds.extend([
        getLng(r),
        getLat(r)
      ]);
    }
  });


  if(!bounds.isEmpty()){

    map.fitBounds(
      bounds,
      {
        padding:100,
        maxZoom:13
      }
    );
  }
}
